name: Build APK

on:
  push:
    branches: ["**"]
    # The BINDERS game has its own workflows; its changes should not publish a widgets release.
    paths-ignore:
      - "binders/**"
      - ".github/workflows/binders-*.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
            echo "::add-mask::$PASS"
            echo "SIGNING_NOTE=Signed with the permanent key: installs as an update." >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias widgets \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Islamic Widgets"
            echo "SIGNING_NOTE=Signed with a temporary key: uninstall the previous version before installing." >> "$GITHUB_ENV"
          fi
          {
            echo "SIGNING_KEYSTORE=$KS"
            echo "SIGNING_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_PASSWORD=$PASS"
            echo "SIGNING_KEY_ALIAS=widgets"
          } >> "$GITHUB_ENV"

      - name: Check widget layouts (renders every widget with Android's text engine)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload layout snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-snapshots
          path: app/build/snapshots/

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk IslamicWidgets.apk
          gh release create "v1.0.${{ github.run_number }}" IslamicWidgets.apk \
            --target "${{ github.sha }}" \
            --title "ويدجت إسلامية 1.0.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. ${{ env.SIGNING_NOTE }}" \
            --latest
