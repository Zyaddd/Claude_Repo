name: BINDERS Android build

on:
  push:
    paths:
      - "binders/unity/**"
      - "binders/core/Binders.Core/**"
      - ".github/workflows/binders-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binders-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See binders/README.md (Unity license)."
            exit 1
          fi

      - name: Free disk space for the Unity image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: binders/unity/Library
          key: Library-Android-${{ hashFiles('binders/unity/Packages/manifest.json', 'binders/unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('binders/unity/Assets/**', 'binders/core/Binders.Core/**') }}
          restore-keys: |
            Library-Android-${{ hashFiles('binders/unity/Packages/manifest.json', 'binders/unity/ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Build APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: binders/unity
          targetPlatform: Android
          buildName: BINDERS
          buildMethod: Binders.EditorTools.BuildScript.BuildAndroid
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BINDERS-apk
          path: build/Android/*.apk
          if-no-files-found: error

      - name: Publish beta download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls build/Android/*.apk | head -1)
          cp "$APK" BINDERS.apk
          # One fixed tag, replaced on every build, so the download link never changes.
          # Marked as pre-release and not "latest", so the widgets app keeps its own latest release.
          gh release delete binders-beta --yes --cleanup-tag 2>/dev/null || true
          gh release create binders-beta BINDERS.apk \
            --target "${{ github.sha }}" \
            --title "BINDERS beta 0.1.${{ github.run_number }}" \
            --notes "نسخة تجريبية من ${{ github.sha }}. نزّل BINDERS.apk على موبايل أندرويد." \
            --prerelease --latest=false
