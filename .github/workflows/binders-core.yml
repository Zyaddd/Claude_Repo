name: BINDERS rules engine

on:
  push:
    paths:
      - "binders/core/**"
      - ".github/workflows/binders-core.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run rules, voice and simulation tests
        working-directory: binders/core
        run: dotnet test --logger "console;verbosity=normal"
