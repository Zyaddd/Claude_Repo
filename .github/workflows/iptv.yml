name: Build Arab TV APK

on:
  push:
    branches: ["**"]
    paths:
      - "iptv/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/iptv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arabtv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Updates only install over the existing app when every build is signed with the same key.
      # Preferred: the secret SIGNING_PASSWORD (a long password you choose). The first build then
      # creates a key, stores it in the repository encrypted with that password (AES-256), and
      # every later build decrypts and reuses it. Without the secret, builds get a temporary key.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          ENC="iptv/signing/arabtv.jks.enc"
          ALIAS=arabtv
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            ALIAS=widgets
            PASS="$KS_PASS"
            echo "SIGNING_NOTE=Signed with the permanent key: installs as an update." >> "$GITHUB_ENV"
          elif [ -n "$KS_PASS" ]; then
            PASS="$KS_PASS"
            if [ -f "$ENC" ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$ENC" -out "$KS" -pass env:KS_PASS \
                || { echo "::error::Could not decrypt $ENC: SIGNING_PASSWORD changed?"; exit 1; }
            else
              keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
                -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 20000 -dname "CN=Arab TV"
              mkdir -p "$(dirname "$ENC")"
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out "$ENC" -pass env:KS_PASS
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$ENC"
              git commit -m "Add the encrypted Arab TV signing key"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
            echo "SIGNING_NOTE=Signed with the permanent key: installs as an update." >> "$GITHUB_ENV"
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arab TV"
            echo "SIGNING_NOTE=Signed with a temporary key: uninstall the previous version before installing. Add the SIGNING_PASSWORD secret to fix this." >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$PASS"
          {
            echo "SIGNING_KEYSTORE=$KS"
            echo "SIGNING_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_PASSWORD=$PASS"
            echo "SIGNING_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Unit tests (playlist parsing, categories, remote protocol)
        run: |
          chmod +x gradlew
          ./gradlew :iptv:testDebugUnitTest --no-daemon

      - name: Lint (errors fail the build)
        run: ./gradlew :iptv:lintRelease --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabtv-lint
          path: iptv/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Build release APK
        run: ./gradlew :iptv:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArabTV-apk
          path: iptv/build/outputs/apk/release/iptv-release.apk

      # A fixed tag so the download link never changes. Not marked "latest", so the
      # Islamic Widgets link (releases/latest) keeps pointing at that app.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp iptv/build/outputs/apk/release/iptv-release.apk ArabTV.apk
          gh release delete arabtv --cleanup-tag -y || true
          gh release create arabtv ArabTV.apk \
            --target "${{ github.sha }}" \
            --title "Arab TV 1.0.${{ github.run_number }}" \
            --notes "versionCode: ${{ github.run_number }}
          Built from ${{ github.sha }} (branch ${{ github.ref_name }}). ${{ env.SIGNING_NOTE }}" \
            --latest=false
